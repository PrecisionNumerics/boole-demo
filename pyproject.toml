[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "boole-demo"
version = "0.1.0.dev0"
description = "Run Boole 1.7B locally with llama.cpp or vLLM + Humming"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "torch>=2.7",
  "safetensors>=0.4",
  "huggingface_hub>=0.30",
]

[project.optional-dependencies]
# The loader targets these public runtime releases.
vllm = ["vllm==0.31.0", "humming-kernels==0.1.16"]

[project.urls]
Repository = "https://github.com/PrecisionNumerics/boole-demo"

[project.scripts]
boole-prep = "boole_demo.cli:main"

[project.entry-points."vllm.general_plugins"]
boole_w1 = "boole_demo.vllm_plugin:register"

[tool.hatch.build.targets.wheel]
packages = ["src/boole_demo"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
